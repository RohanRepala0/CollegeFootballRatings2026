[project]
name = "cfbmodel"
version = "0.1.0"
description = "College football spread model: blend public ratings with the market and price any line."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "duckdb>=1.0",
    "typer>=0.12",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "matplotlib>=3.8",
    "openpyxl>=3.1.5",
    "tabulate>=0.10.0",
    "pytz>=2026.5",
]

[project.scripts]
cfb = "cfbmodel.cli:app"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cfbmodel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
